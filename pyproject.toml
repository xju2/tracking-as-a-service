[project]
name = "tracking-as-a-service"
version = "2.0.0"
description = "Tracking as a Service."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
keywords = ["tracking", "HEP", "Triton", "IaaS"]
authors = [
  {name = "X. Ju", email = "xju@lbl.gov" }
]
dependencies = [
  "torch>=2.8.0,<3",
  "torch-geometric>=2.6.1,<3",
  "numba>=0.62.1,<0.63",
  "scipy>=1.15,<2",
  "uproot>=5.6,<6",
  "torch-scatter>=2.1.2,<3",
  "frnn",
  "prefix-sum",
]

[dependency-groups]
dev = ["pre-commit>=4.5.1,<5"]

[tool.uv.sources]
frnn = { git = "https://github.com/xju2/FRNN", rev = "9b57ef4a7c194e2f1372591d3ea33ab254295a51" }
prefix-sum = { git = "https://github.com/asnaylor/prefix_sum", rev = "008f3239e3f3e65e48c04796d606c5595f2417bf" }

# These CUDA extensions import torch at build time; build them against the locked torch.
[tool.uv.extra-build-dependencies]
torch-scatter = [{ requirement = "torch", match-runtime = true }]
frnn = [{ requirement = "torch", match-runtime = true }]
prefix-sum = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
torch-scatter = { FORCE_CUDA = "1" }

# Their setup.py imports torch, so uv cannot read their metadata without building them.
[[tool.uv.dependency-metadata]]
name = "torch-scatter"
version = "2.1.2"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "frnn"
version = "0.0.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "prefix-sum"
version = "0.0.0"
requires-dist = []


[tool.ruff]
line-length = 99
preview = true
exclude = ["*.ipynb"]
[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D205", "D401", "D203", "D213", "D107", "D413",
    "S101", "S404", "S602", "S403", "S105", "S301", "PLR2004", "PLR0912", "PLR0913",
    "PLR0914", "PLR0915", "PLR0917", "PLC0415", "PLW1514", "PLR6301", "PLR1702", "PLR0904",
    "F401", "E501", "C901", "I001", "COM", "EM", "FIX", "FBT", "G004",
    "N802", "N803", "N806", "N812", "T201", "PTH123", "RUF015", "RUF017", "ERA", "ISC001",
    "RET504", "SLF001",
    "TD003", "ARG002", "N999", "TRY201", "TRY003", "ANN", "CPY", "INP001"
]
